  <text x="185" y="863" fill="#d7ff69" font-family="'SFMono-Regular', Consolas, monospace" font-size="11">✓ fastpath-shm  ✓ siv-beads-unit  ✓ engine-ipc  ✓ mcp-gateway  ✓ multi-agent-cluster  ✓ qxctl-extension</text>

