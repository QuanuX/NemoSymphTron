  <text x="60" y="429" fill="#858b92" font-family="'SFMono-Regular', Consolas, monospace" font-size="10.5" letter-spacing="0.8">KERNEL IDENTIFIER</text>
  <text x="285" y="429" fill="#858b92" font-family="'SFMono-Regular', Consolas, monospace" font-size="10.5" letter-spacing="0.8">QUANTITATIVE / CLUSTER OPERATION</text>
  <text x="900" y="429" fill="#858b92" font-family="'SFMono-Regular', Consolas, monospace" font-size="10.5" letter-spacing="0.8" text-anchor="end">ACCELERATOR</text>

  <text x="60" y="467" fill="#72f6ff" font-family="'SFMono-Regular', Consolas, monospace" font-size="11.5">01 · MONTE_CARLO_VAR</text>
  <text x="285" y="467" fill="#d8dcdf" font-family="'SFMono-Regular', Consolas, monospace" font-size="11.5">Multi-asset Geometric Brownian Motion 99% VaR &amp; CVaR tail reduction</text>
  <text x="900" y="467" fill="#d7ff69" font-family="'SFMono-Regular', Consolas, monospace" font-size="11" text-anchor="end">cuRAND / FP64</text>

  <text x="60" y="506" fill="#8f7cff" font-family="'SFMono-Regular', Consolas, monospace" font-size="11.5">02 · CHOLESKY_DECOMP</text>
  <text x="285" y="506" fill="#d8dcdf" font-family="'SFMono-Regular', Consolas, monospace" font-size="11.5">Positive-definite covariance matrix LL^T factorization &amp; conditioning</text>
  <text x="900" y="506" fill="#d7ff69" font-family="'SFMono-Regular', Consolas, monospace" font-size="11" text-anchor="end">cuSOLVER</text>

  <text x="60" y="545" fill="#ff69c6" font-family="'SFMono-Regular', Consolas, monospace" font-size="11.5">03 · CUOPT_PORTFOLIO</text>
  <text x="285" y="545" fill="#d8dcdf" font-family="'SFMono-Regular', Consolas, monospace" font-size="11.5">Mean-variance &amp; Sharpe ratio simplex portfolio weight optimization</text>
  <text x="900" y="545" fill="#d7ff69" font-family="'SFMono-Regular', Consolas, monospace" font-size="11" text-anchor="end">cuBLAS / cuOpt</text>

  <text x="60" y="584" fill="#ffb45f" font-family="'SFMono-Regular', Consolas, monospace" font-size="11.5">04 · TX_RISK_SCORE</text>
  <text x="285" y="584" fill="#d8dcdf" font-family="'SFMono-Regular', Consolas, monospace" font-size="11.5">Sub-millisecond inline anomaly scoring (ALLOW / CHALLENGE / BLOCK)</text>
  <text x="900" y="584" fill="#d7ff69" font-family="'SFMono-Regular', Consolas, monospace" font-size="11" text-anchor="end">Nemotron Nano FP4</text>

  <text x="60" y="623" fill="#72f6ff" font-family="'SFMono-Regular', Consolas, monospace" font-size="11.5">05 · FFT_OPTION_PRICING</text>
  <text x="285" y="623" fill="#d8dcdf" font-family="'SFMono-Regular', Consolas, monospace" font-size="11.5">Carr-Madan Fast Fourier Transform spectral option surface pricing</text>
  <text x="900" y="623" fill="#d7ff69" font-family="'SFMono-Regular', Consolas, monospace" font-size="11" text-anchor="end">cuFFT</text>

  <text x="60" y="662" fill="#d7ff69" font-family="'SFMono-Regular', Consolas, monospace" font-size="11.5">06 · NCCL_MULTI_NODE_SIM</text>
  <text x="285" y="662" fill="#d8dcdf" font-family="'SFMono-Regular', Consolas, monospace" font-size="11.5">Multi-node RoCEv2 &amp; NVLink 6 SHARPv4 All-Reduce collective sync</text>
  <text x="900" y="662" fill="#d7ff69" font-family="'SFMono-Regular', Consolas, monospace" font-size="11" text-anchor="end">NCCL / SHARPv4</text>

