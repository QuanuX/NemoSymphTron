  <!-- SECTION 04: DUAL-PLANE C++26 ARCHITECTURE -->
  <text x="40" y="46" fill="#858b92" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="11" letter-spacing="2">04 // DUAL-PLANE C++26 RUNTIME &amp; HARDWARE ISOLATION</text>
  <text x="40" y="82" fill="#f6f7f8" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="700" letter-spacing="-0.8">Strict Separation of Sub-Microsecond Execution &amp; Agentic Control</text>

  <!-- Plane 1 & Plane 2 Side-by-Side Cards -->
  <rect x="40" y="106" width="880" height="236" fill="#080a0b" stroke="#1e2227" stroke-width="1"/>
