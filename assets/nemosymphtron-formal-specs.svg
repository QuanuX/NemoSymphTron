  <!-- Plane 1 Card -->
  <text x="64" y="136" fill="#d7ff69" font-family="'SFMono-Regular', Consolas, monospace" font-size="10.5" letter-spacing="1.4">PLANE 01 // nemosymphtron-engine</text>
  <text x="64" y="164" fill="#f6f7f8" font-family="Inter, -apple-system, sans-serif" font-size="18" font-weight="700">Sovereign C++26 CUDA &amp; Beads Daemon</text>
  <text x="64" y="192" fill="#989ea4" font-family="Inter, -apple-system, sans-serif" font-size="12.5">• <tspan fill="#f6f7f8" font-weight="600">Pool 1 (Symphony Fast-Path):</tspan> Lock-free 64B-aligned SPSC</text>
  <text x="76" y="212" fill="#989ea4" font-family="Inter, -apple-system, sans-serif" font-size="12.5">ring buffer (<tspan fill="#72f6ff" font-family="'SFMono-Regular', Consolas, monospace">/nemosymphtron_fastpath</tspan>), CUDA stream priority</text>
  <text x="76" y="232" fill="#989ea4" font-family="Inter, -apple-system, sans-serif" font-size="12.5"><tspan fill="#d7ff69" font-family="'SFMono-Regular', Consolas, monospace">-1</tspan> (Blackwell) / <tspan fill="#d7ff69" font-family="'SFMono-Regular', Consolas, monospace">-2</tspan> (Rubin), zero LLM/MCP interference.</text>
  <text x="64" y="258" fill="#989ea4" font-family="Inter, -apple-system, sans-serif" font-size="12.5">• <tspan fill="#f6f7f8" font-weight="600">Pool 2 (Dynamic Agent Stream Pool):</tspan> Length-prefixed binary</text>
  <text x="76" y="278" fill="#989ea4" font-family="Inter, -apple-system, sans-serif" font-size="12.5">wire protocol over <tspan fill="#72f6ff" font-family="'SFMono-Regular', Consolas, monospace">0600 AF_UNIX</tspan>, <tspan fill="#f6f7f8" font-family="'SFMono-Regular', Consolas, monospace">O(1) constexpr</tspan> 64-bit</text>
  <text x="76" y="298" fill="#989ea4" font-family="Inter, -apple-system, sans-serif" font-size="12.5"><tspan fill="#ff69c6" font-family="'SFMono-Regular', Consolas, monospace">SIVFlags</tspan> verification, and per-agent non-blocking streams.</text>

  <!-- Plane 2 Card -->
  <text x="504" y="136" fill="#72f6ff" font-family="'SFMono-Regular', Consolas, monospace" font-size="10.5" letter-spacing="1.4">PLANE 02 // nemosymphtron-mcp &amp; nemosymphtron-ctl</text>
  <text x="504" y="164" fill="#f6f7f8" font-family="Inter, -apple-system, sans-serif" font-size="18" font-weight="700">MCP (2025-11-25) Gateway &amp; qxctl Owner</text>
  <text x="504" y="192" fill="#989ea4" font-family="Inter, -apple-system, sans-serif" font-size="12.5">• <tspan fill="#f6f7f8" font-weight="600">35 Registered qxctl Commands:</tspan> Packaged in</text>
  <text x="516" y="212" fill="#989ea4" font-family="Inter, -apple-system, sans-serif" font-size="12.5"><tspan fill="#72f6ff" font-family="'SFMono-Regular', Consolas, monospace">catalog/qxctl_extension_commands.json</tspan> (<tspan fill="#f6f7f8" font-family="'SFMono-Regular', Consolas, monospace">nst</tspan>, <tspan fill="#f6f7f8" font-family="'SFMono-Regular', Consolas, monospace">siv</tspan>, <tspan fill="#f6f7f8" font-family="'SFMono-Regular', Consolas, monospace">beads</tspan>, <tspan fill="#f6f7f8" font-family="'SFMono-Regular', Consolas, monospace">shv</tspan>, <tspan fill="#f6f7f8" font-family="'SFMono-Regular', Consolas, monospace">scv</tspan>).</text>
  <text x="504" y="238" fill="#989ea4" font-family="Inter, -apple-system, sans-serif" font-size="12.5">• <tspan fill="#f6f7f8" font-weight="600">54 JSON-RPC 2.0 MCP Tools:</tspan> Exposes <tspan fill="#72f6ff" font-family="'SFMono-Regular', Consolas, monospace">nemosymphtron_connection</tspan></text>
  <text x="516" y="258" fill="#989ea4" font-family="Inter, -apple-system, sans-serif" font-size="12.5">plus 53 operation-specific read, preview, and apply tools.</text>
  <text x="504" y="284" fill="#989ea4" font-family="Inter, -apple-system, sans-serif" font-size="12.5">• <tspan fill="#f6f7f8" font-weight="600">Session-Pinned Safety Circuits:</tspan> 5-minute preview tokens,</text>
  <text x="516" y="304" fill="#989ea4" font-family="Inter, -apple-system, sans-serif" font-size="12.5">SHA-256 file pinning, and Compare-And-Swap state digests.</text>

