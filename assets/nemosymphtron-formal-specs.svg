  <text x="64" y="772" fill="#f6f7f8" font-family="Inter, -apple-system, sans-serif" font-size="20" font-weight="700">Zero Upstream Modification · Explicit Prefix Binding · 6/6 CTest Suites</text>
  <text x="64" y="800" fill="#b6bbc0" font-family="Inter, -apple-system, sans-serif" font-size="13.5">NemoSymphTron never alters <tspan fill="#72f6ff" font-family="'SFMono-Regular', Consolas, monospace">QuanuX/Symphony</tspan>. Its 35 <tspan fill="#f6f7f8" font-family="'SFMono-Regular', Consolas, monospace">qxctl</tspan> extension routes and 54 MCP tools attach</text>
  <text x="64" y="822" fill="#b6bbc0" font-family="Inter, -apple-system, sans-serif" font-size="13.5">only when explicitly registered to an operator-owned Symphony installation prefix and <tspan fill="#f6f7f8" font-family="'SFMono-Regular', Consolas, monospace">--tops-id</tspan> UUID.</text>

