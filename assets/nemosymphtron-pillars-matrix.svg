<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 1160" width="100%" height="100%">
  <defs>
    <linearGradient id="dividerRule2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e2227"/>
      <stop offset="20%" stop-color="#72f6ff"/>
      <stop offset="40%" stop-color="#8f7cff"/>
      <stop offset="60%" stop-color="#ff69c6"/>
      <stop offset="80%" stop-color="#d7ff69"/>
      <stop offset="100%" stop-color="#1e2227"/>
    </linearGradient>
  </defs>

  <!-- Outer Frame -->
  <rect width="960" height="1160" fill="#050607" stroke="#1e2227" stroke-width="2"/>

  <!-- SECTION 01: THE ARCHITECTURAL BREAKTHROUGH -->
  <text x="40" y="48" fill="#858b92" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="11" letter-spacing="2">01 // THE ARCHITECTURAL BREAKTHROUGH</text>
  <text x="40" y="88" fill="#f6f7f8" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="32" font-weight="700" letter-spacing="-1">Solving the Quantitative AI Paradox on <tspan fill="#72f6ff">NVIDIA Silicon.</tspan></text>

  <text x="40" y="124" fill="#b6bbc0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5">Quantitative hedge funds, market makers, and institutional trading desks face a structural wall when adopting agentic AI:</text>
  <text x="40" y="147" fill="#f6f7f8" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="600">traditional LLM serving stacks introduce unpredictable memory allocation spikes, PCIe copy bottlenecks, and millisecond jitter</text>
  <text x="40" y="170" fill="#b6bbc0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5">that violate deterministic execution guarantees. <tspan fill="#f6f7f8" font-weight="700">NemoSymphTron</tspan> eliminates this tradeoff across <tspan fill="#f6f7f8" font-weight="700">Grace-Blackwell NVLink-C2C</tspan>,</text>
  <text x="40" y="193" fill="#b6bbc0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5"><tspan fill="#f6f7f8" font-weight="700">Vera-Rubin HBM4</tspan>, <tspan fill="#f6f7f8" font-weight="700">TensorRT-LLM</tspan>, <tspan fill="#f6f7f8" font-weight="700">CCCL</tspan>, <tspan fill="#f6f7f8" font-weight="700">DOCA</tspan>, and <tspan fill="#f6f7f8" font-weight="700">Nemotron-3</tspan>.</text>

  <!-- SECTION 02: THE 6 PRODUCT PILLARS -->
  <text x="40" y="242" fill="#858b92" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="11" letter-spacing="2">02 // COMPLETE PRODUCT CAPABILITIES &amp; ARCHITECTURE</text>

  <!-- 2x3 Grid Container -->
  <rect x="40" y="262" width="880" height="585" fill="#080a0b" stroke="#1e2227" stroke-width="1"/>
  <line x1="480" y1="262" x2="480" y2="847" stroke="#1e2227" stroke-width="1"/>
  <line x1="40" y1="457" x2="920" y2="457" stroke="#1e2227" stroke-width="1"/>
  <line x1="40" y1="652" x2="920" y2="652" stroke="#1e2227" stroke-width="1"/>

  <!-- PILLAR 01 -->
  <text x="64" y="292" fill="#858b92" font-family="'SFMono-Regular', Consolas, monospace" font-size="10.5">PILLAR 01</text>
  <text x="456" y="292" fill="#72f6ff" font-family="'SFMono-Regular', Consolas, monospace" font-size="10.5" text-anchor="end">SM_120 // SM_130</text>
  <text x="64" y="320" fill="#72f6ff" font-family="'SFMono-Regular', Consolas, monospace" font-size="10.5" letter-spacing="1.4">DUAL-POOL UNIFIED MEMORY ENGINE</text>
  <text x="64" y="346" fill="#f6f7f8" font-family="Inter, -apple-system, sans-serif" font-size="18.5" font-weight="700">Grace-Blackwell &amp; Vera-Rubin Isolation</text>
  <text x="64" y="374" fill="#989ea4" font-family="Inter, -apple-system, sans-serif" font-size="13">Exploits NVLink-C2C coherent memory on <tspan fill="#f6f7f8" font-weight="600">DGX Spark (GB10,</tspan></text>
  <text x="64" y="394" fill="#989ea4" font-family="Inter, -apple-system, sans-serif" font-size="13"><tspan fill="#f6f7f8" font-weight="600">128GB LPDDR5x)</tspan> and <tspan fill="#f6f7f8" font-weight="600">Vera-Rubin (288GB HBM4)</tspan> to isolate a</text>
  <text x="64" y="414" fill="#989ea4" font-family="Inter, -apple-system, sans-serif" font-size="13">pinned <tspan fill="#f6f7f8" font-weight="600">Deterministic Quant Pool</tspan> from elastic <tspan fill="#f6f7f8" font-weight="600">Cognitive KV-</tspan></text>
  <text x="64" y="434" fill="#989ea4" font-family="Inter, -apple-system, sans-serif" font-size="13"><tspan fill="#f6f7f8" font-weight="600">Caches</tspan> with real-time NVML thermal &amp; clock governance.</text>

  <!-- PILLAR 02 -->
  <text x="504" y="292" fill="#858b92" font-family="'SFMono-Regular', Consolas, monospace" font-size="10.5">PILLAR 02</text>
  <text x="896" y="292" fill="#d7ff69" font-family="'SFMono-Regular', Consolas, monospace" font-size="10.5" text-anchor="end">TENSORRT-LLM // FP4</text>
  <text x="504" y="320" fill="#d7ff69" font-family="'SFMono-Regular', Consolas, monospace" font-size="10.5" letter-spacing="1.4">TIERED NEMOTRON COGNITIVE ROUTING</text>
  <text x="504" y="346" fill="#f6f7f8" font-family="Inter, -apple-system, sans-serif" font-size="18.5" font-weight="700">Full NVIDIA Nemotron-3 &amp; Cascade-2 Control</text>
  <text x="504" y="374" fill="#989ea4" font-family="Inter, -apple-system, sans-serif" font-size="13">Orchestrates <tspan fill="#f6f7f8" font-weight="600">Nemotron-3 Nano (FP4)</tspan> for inline sub-millisecond</text>
  <text x="504" y="394" fill="#989ea4" font-family="Inter, -apple-system, sans-serif" font-size="13">order-book anomaly gating, <tspan fill="#f6f7f8" font-weight="600">Nemotron-3 Super</tspan> for quantitative</text>
  <text x="504" y="414" fill="#989ea4" font-family="Inter, -apple-system, sans-serif" font-size="13">strategy synthesis, and <tspan fill="#f6f7f8" font-weight="600">Nemotron-3 Ultra / Cascade-2 MoE</tspan></text>
  <text x="504" y="434" fill="#989ea4" font-family="Inter, -apple-system, sans-serif" font-size="13">for deep macro reasoning via <tspan fill="#f6f7f8" font-weight="600">TensorRT-LLM</tspan> and <tspan fill="#f6f7f8" font-weight="600">CCCL</tspan>.</text>

  <!-- PILLAR 03 -->
  <text x="64" y="487" fill="#858b92" font-family="'SFMono-Regular', Consolas, monospace" font-size="10.5">PILLAR 03</text>
  <text x="456" y="487" fill="#ffb45f" font-family="'SFMono-Regular', Consolas, monospace" font-size="10.5" text-anchor="end">&lt; 200NS IPC</text>
  <text x="64" y="515" fill="#ffb45f" font-family="'SFMono-Regular', Consolas, monospace" font-size="10.5" letter-spacing="1.4">LOCK-FREE SHARED MEMORY FAST-PATH</text>
  <text x="64" y="541" fill="#f6f7f8" font-family="Inter, -apple-system, sans-serif" font-size="18.5" font-weight="700">Zero-Copy Tick-to-Agent Telemetry Bridge</text>
  <text x="64" y="569" fill="#989ea4" font-family="Inter, -apple-system, sans-serif" font-size="13">A 64-byte cache-line-aligned POSIX shared-memory ring buffer</text>
  <text x="64" y="589" fill="#989ea4" font-family="Inter, -apple-system, sans-serif" font-size="13">(<tspan fill="#f6f7f8" font-family="'SFMono-Regular', Consolas, monospace">symphony-fastpath-client</tspan>) streams market microstructure</text>
  <text x="64" y="609" fill="#989ea4" font-family="Inter, -apple-system, sans-serif" font-size="13">vectors and hardware circuit-breaker signals between Symphony's</text>
  <text x="64" y="629" fill="#989ea4" font-family="Inter, -apple-system, sans-serif" font-size="13">C++26 core and GPU streams in under <tspan fill="#f6f7f8" font-weight="600">200 nanoseconds</tspan>.</text>

  <!-- PILLAR 04 -->
  <text x="504" y="487" fill="#858b92" font-family="'SFMono-Regular', Consolas, monospace" font-size="10.5">PILLAR 04</text>
  <text x="896" y="487" fill="#ff69c6" font-family="'SFMono-Regular', Consolas, monospace" font-size="10.5" text-anchor="end">DOCA // NCCL // ROCEV2</text>
  <text x="504" y="515" fill="#ff69c6" font-family="'SFMono-Regular', Consolas, monospace" font-size="10.5" letter-spacing="1.4">SPLIT-COMPUTE RDMA CLUSTERING</text>
  <text x="504" y="541" fill="#f6f7f8" font-family="Inter, -apple-system, sans-serif" font-size="18.5" font-weight="700">200–800GbE ConnectX &amp; BlueField DPU Fabric</text>
  <text x="504" y="569" fill="#989ea4" font-family="Inter, -apple-system, sans-serif" font-size="13">Turnkey clustering across dual <tspan fill="#f6f7f8" font-weight="600">DGX Spark</tspan> nodes (200GbE QSFP112)</text>
  <text x="504" y="589" fill="#989ea4" font-family="Inter, -apple-system, sans-serif" font-size="13">and multi-rack <tspan fill="#f6f7f8" font-weight="600">ConnectX-7/8 + BlueField DPU</tspan> topologies using</text>
  <text x="504" y="609" fill="#989ea4" font-family="Inter, -apple-system, sans-serif" font-size="13"><tspan fill="#f6f7f8" font-weight="600">NVIDIA DOCA</tspan>, <tspan fill="#f6f7f8" font-weight="600">GPUDirect RDMA</tspan>, <tspan fill="#f6f7f8" font-weight="600">SHARPv4</tspan>, and <tspan fill="#f6f7f8" font-weight="600">NCCL</tspan> for zero-</text>
  <text x="504" y="629" fill="#989ea4" font-family="Inter, -apple-system, sans-serif" font-size="13">copy distributed KV-cache and tensor parallelism.</text>

  <!-- PILLAR 05 -->
  <text x="64" y="682" fill="#858b92" font-family="'SFMono-Regular', Consolas, monospace" font-size="10.5">PILLAR 05</text>
  <text x="456" y="682" fill="#8f7cff" font-family="'SFMono-Regular', Consolas, monospace" font-size="10.5" text-anchor="end">SHV · SCV · SIV</text>
  <text x="64" y="710" fill="#8f7cff" font-family="'SFMono-Regular', Consolas, monospace" font-size="10.5" letter-spacing="1.4">TRI-VECTOR GOVERNANCE &amp; BEADS DAG</text>
  <text x="64" y="736" fill="#f6f7f8" font-family="Inter, -apple-system, sans-serif" font-size="18.5" font-weight="700">Auditable Multi-Agent Consensus Engine</text>
  <text x="64" y="764" fill="#989ea4" font-family="Inter, -apple-system, sans-serif" font-size="13">Every multi-agent <tspan fill="#f6f7f8" font-weight="600">Beads Merkle DAG</tspan> workflow is gated by</text>
  <text x="64" y="784" fill="#989ea4" font-family="Inter, -apple-system, sans-serif" font-size="13">cryptographic <tspan fill="#f6f7f8" font-weight="600">Tri-Vector</tspan> governance: <tspan fill="#f6f7f8" font-weight="600">SHV</tspan> (Hardware Vector),</text>
  <text x="64" y="804" fill="#989ea4" font-family="Inter, -apple-system, sans-serif" font-size="13"><tspan fill="#f6f7f8" font-weight="600">SCV</tspan> (Cloud &amp; RoCEv2 Fabric Vector), and <tspan fill="#f6f7f8" font-weight="600">SIV</tspan> (Intelligence Vector</text>
  <text x="64" y="824" fill="#989ea4" font-family="Inter, -apple-system, sans-serif" font-size="13">with 64-bit <tspan fill="#f6f7f8" font-family="'SFMono-Regular', Consolas, monospace">SIVFlags</tspan>, role allowlists &amp; <tspan fill="#f6f7f8" font-weight="600">NeMo Guardrails</tspan>).</text>

  <!-- PILLAR 06 -->
  <text x="504" y="682" fill="#858b92" font-family="'SFMono-Regular', Consolas, monospace" font-size="10.5">PILLAR 06</text>
  <text x="896" y="682" fill="#72f6ff" font-family="'SFMono-Regular', Consolas, monospace" font-size="10.5" text-anchor="end">35 CLI // 54 MCP TOOLS</text>
  <text x="504" y="710" fill="#72f6ff" font-family="'SFMono-Regular', Consolas, monospace" font-size="10.5" letter-spacing="1.4">MODULAR SYMPHONY &amp; MCP INTEGRATION</text>
  <text x="504" y="736" fill="#f6f7f8" font-family="Inter, -apple-system, sans-serif" font-size="18.5" font-weight="700">Drop-In qxctl Extension &amp; C++26 MCP Bridge</text>
  <text x="504" y="764" fill="#989ea4" font-family="Inter, -apple-system, sans-serif" font-size="13">Installs cleanly as a standalone extension adding <tspan fill="#f6f7f8" font-weight="600">35 qxctl</tspan></text>
  <text x="504" y="784" fill="#989ea4" font-family="Inter, -apple-system, sans-serif" font-size="13"><tspan fill="#f6f7f8" font-weight="600">extension commands</tspan> and <tspan fill="#f6f7f8" font-weight="600">54 JSON-RPC 2.0 MCP tools</tspan> with</text>
  <text x="504" y="804" fill="#989ea4" font-family="Inter, -apple-system, sans-serif" font-size="13">session-pinned 5-minute preview/apply safety circuits, SHA-256</text>
  <text x="504" y="824" fill="#989ea4" font-family="Inter, -apple-system, sans-serif" font-size="13">input pinning, and Compare-And-Swap state mutations.</text>

  <!-- SECTION 03: NVIDIA STACK INTEGRATION MATRIX -->
  <rect x="40" y="876" width="880" height="248" fill="#080a0b" stroke="#1e2227" stroke-width="1"/>
  <text x="64" y="908" fill="#d7ff69" font-family="'SFMono-Regular', Consolas, monospace" font-size="11" letter-spacing="1.8">03 // NVIDIA STACK INTEGRATION MATRIX</text>
  <text x="64" y="936" fill="#f6f7f8" font-family="Inter, -apple-system, sans-serif" font-size="20" font-weight="700" letter-spacing="-0.4">Built for the Full Depth of NVIDIA's Accelerated Computing &amp; NeMo Ecosystem</text>

  <line x1="64" y1="954" x2="896" y2="954" stroke="#1e2227" stroke-width="1"/>
  <line x1="64" y1="1008" x2="896" y2="1008" stroke="#1e2227" stroke-width="1"/>
  <line x1="64" y1="1062" x2="896" y2="1062" stroke="#1e2227" stroke-width="1"/>

  <text x="64" y="985" fill="#72f6ff" font-family="'SFMono-Regular', Consolas, monospace" font-size="11" letter-spacing="1">ACTIVE RUNTIME CORE</text>
  <text x="280" y="985" fill="#d8dcdf" font-family="Inter, -apple-system, sans-serif" font-size="13"><tspan fill="#f6f7f8" font-weight="700">NVIDIA Nemotron-3</tspan> (Nano / Super / Ultra) · <tspan fill="#f6f7f8" font-weight="700">TensorRT &amp; TensorRT-LLM</tspan> (FP4/FP8) · <tspan fill="#f6f7f8" font-weight="700">CCCL</tspan> · <tspan fill="#f6f7f8" font-weight="700">DOCA</tspan> · <tspan fill="#f6f7f8" font-weight="700">NCCL</tspan></text>

  <text x="64" y="1039" fill="#8f7cff" font-family="'SFMono-Regular', Consolas, monospace" font-size="11" letter-spacing="1">NEMO &amp; AGENT STACK</text>
  <text x="280" y="1039" fill="#d8dcdf" font-family="Inter, -apple-system, sans-serif" font-size="13"><tspan fill="#f6f7f8" font-weight="700">NeMo Framework</tspan> · <tspan fill="#f6f7f8" font-weight="700">NeMo Agent Toolkit</tspan> · <tspan fill="#f6f7f8" font-weight="700">NeMo Guardrails</tspan> · <tspan fill="#f6f7f8" font-weight="700">NeMo Retriever &amp; Curator</tspan> · <tspan fill="#f6f7f8" font-weight="700">Model Optimizer</tspan></text>

  <text x="64" y="1093" fill="#ff69c6" font-family="'SFMono-Regular', Consolas, monospace" font-size="11" letter-spacing="1">TARGET PLATFORMS</text>
  <text x="280" y="1093" fill="#d8dcdf" font-family="Inter, -apple-system, sans-serif" font-size="13"><tspan fill="#f6f7f8" font-weight="700">NVIDIA DGX Spark</tspan> (GB10 sm_120) · <tspan fill="#f6f7f8" font-weight="700">HGX B200 / GB200 NVL72</tspan> · <tspan fill="#f6f7f8" font-weight="700">Vera-Rubin (sm_130)</tspan> · <tspan fill="#f6f7f8" font-weight="700">ConnectX-7/8</tspan> · <tspan fill="#f6f7f8" font-weight="700">BlueField-3/4</tspan></text>

  <!-- Bottom Spectral Divider -->
  <rect x="40" y="1144" width="880" height="1.5" fill="url(#dividerRule2)"/>
</svg>
