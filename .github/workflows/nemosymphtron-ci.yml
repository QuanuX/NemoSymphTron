name: NemoSymphTron CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-and-test:
    name: Build & CTest (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install Clang 19 on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-19
          echo 'CXX=clang++-19' >> "$GITHUB_ENV"
      - name: Configure and compile C++26 engine, MCP gateway, and qxctl extension
        run: |
          options=()
          if [ "$(uname -s)" = Darwin ]; then
            options+=('-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64' '-DCMAKE_OSX_DEPLOYMENT_TARGET=15.0')
          fi
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DNEMOSYMPHTRON_ENABLE_CUDA=OFF "${options[@]}"
          cmake --build build -j 2
      - name: Run C++26 and Python CTest verification suite
        run: ctest --test-dir build --output-on-failure
      - name: Build and exercise the native release archive
        run: |
          case "$(uname -s)-$(uname -m)" in
            Darwin-*) target=macos15-universal ;;
            Linux-aarch64) target=ubuntu24.04-arm64 ;;
            Linux-x86_64) target=ubuntu24.04-x86_64 ;;
            *) exit 1 ;;
          esac
          python3 scripts/package_release.py --build build --target "$target" --out dist
          python3 tests/test_release_install.py dist/*.mcpb
      - name: Save the verified archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nemosymphtron-${{ matrix.runner }}
          path: dist/*.mcpb
          if-no-files-found: error
