# Netplan configuration for NVIDIA DGX Spark Dual-Node 200GbE ConnectX-7 RoCE v2 Mesh
# Apply via: sudo netplan apply (only after SCV preview & apply ratification)
network:
  version: 2
  renderer: networkd
  ethernets:
    enp1s0f0np0:
      dhcp4: false
      dhcp6: false
      mtu: 9000
      addresses:
        - 192.168.100.1/24
    enp1s0f0np1:
      dhcp4: false
      dhcp6: false
      mtu: 9000
      addresses:
        - 192.168.101.1/24
